{t:'Глава 3. Курьер с мечтой',e:'🛵',n:'Мира, курьер',clue:'Хочу что-то про дорогу и новую мечту…',

{t:'Глава 4. Банк тепла',e:'🎩',n:'Аркадий Львович, директор',clue:'Сегодня все пришли. Хочу, чтобы мы поели вместе, как семья.',

(function loop(){cx.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l-=.025;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,5,0,7);cx.fill()});requestAnimationFrame(loop)})();

$('#bBk').onclick=()=>{if(G&&G.on)openBook(1)};
$('#bServe').onclick=()=>{
 if(!G||!G.on||!G.c)return;const r=G.c.rec,ok=G.plate.length===4&&r.i.every(x=>G.plate.includes(x)),cx0=innerWidth/2,cy0=innerHeight*.35;
 if(ok){G.combo++;G.bc=Math.max(G.bc,G.combo);G.fever=G.combo>=5?1:0;const syn=SYN.filter(p=>p.every(x=>r.i.includes(x))).length,k=G.c.pat/G.c.max,
  pts=Math.round((100+k*60+G.combo*10+syn*40)*(G.fever?2:1));G.score+=pts;G.tips+=Math.round((syn*3+k*6)*(1+S.up.tip*.25));
  if(syn){G.t+=2;flt('✨ Синергия! +2 сек',cx0-70,cy0+30,'#6cc5a1')}if(G.c.sp)G.spOk=1;G.served++;
  flt('+'+pts,cx0-20,cy0,'#2f3b52');burst(cx0,cy0,G.fever?30:16);sGood();note('success');G.c=null;G.plate=[];setTimeout(spawn,350)}
 else{G.combo=0;G.fever=0;G.c.pat-=3;G.plate=[];flt('Не то блюдо!',cx0-60,cy0,'#f2735f');shake();sBad();note('error')}
 draw()};
function endShift(){
 G.on=0;clearInterval(G.iv);clearTimeout(mt);try{tg.disableClosingConfirmation()}catch(e){}
 const coins=Math.floor(G.score/8)+G.tips,goal=GOAL[S.fin?3:S.ch];G.win=G.score>=goal;S.coins+=coins;S.best=Math.max(S.best,G.score);save();
 $('#rt').textContent=G.win?'Смена удалась! 🎉':'Смена окончена';
 $('#rb').innerHTML='<p>Очки: <b>'+G.score+'</b> из '+goal+'</p><p>Подано: '+G.served+', ушло голодными: '+G.lost+'</p><p>Лучшее комбо: ×'+G.bc+'</p><p>Заработано: <b>'+coins+'</b> 🪙 (чаевые: '+G.tips+')</p>'+(G.win?'':'<p>Не хватило очков. Улучши кухню и повтори смену.</p>');
 sGood();show('res')}
$('#rOk').onclick=()=>{
 if(S.fin||!G.win&&!G.spOk&&false)return menu();
 const st=ST[S.ch];say(G.spOk?st.win:st.lose,()=>{if(!G.win)return menu();if(S.ch<3){S.ch++;save();menu()}else{S.fin=1;save();say(EPI,menu)}})};
/* ===== Menu, kitchen, book ===== */
$('#bPlay').onclick=()=>{if(!S.fin&&S.seen<S.ch){S.seen=S.ch;save();say(ST[S.ch].intro,startShift)}else startShift()};
$('#bMute').onclick=()=>{S.mute=S.mute?0:1;save();menu()};
$('#bKit').onclick=kit;$('#kBack').onclick=menu;$('#bkBack').onclick=()=>{if(G&&G.on)show('game');else menu()};
function kit(){$('#coins').textContent=S.coins;
 $('#ups').innerHTML=UP.map(u=>{const l=S.up[u.id],cost=u.b*(l+1),mx=l>=u.m;return '<div class="box row"><div><b>'+u.n+'</b><p>'+u.d+'</p><span class="pip">'+'●'.repeat(l)+'○'.repeat(u.m-l)+'</span></div><button data-u="'+u.id+'" '+(mx||S.coins<cost?'disabled':'')+'>'+(mx?'Макс':cost+' 🪙')+'</button></div>'}).join('');show('kit')}
$('#ups').onclick=e=>{const b=e.target.closest('button');if(!b)return;const u=UP.find(x=>x.id===b.dataset.u),c=u.b*(S.up[u.id]+1);
 if(S.coins<c||S.up[u.id]>=u.m)return;S.coins-=c;S.up[u.id]++;save();sGood();hap('medium');kit()};
function openBook(inGame){const lvl=S.fin?3:S.ch;
 $('#bl').innerHTML=R.map(r=>r.ch<=lvl?'<div class="box"><b>'+r.n+'</b> <i>('+r.m+')</i><p>'+r.i.map(x=>I[x].e+' '+I[x].n).join(' · ')+'</p></div>':'<div class="box" style="opacity:.5">🔒 Откроется в главе '+(r.ch+1)+'</div>').join('');show('book')}
$('#bBook').onclick=()=>openBook(0);
/* ===== Boot ===== */
store.get('hyperbank').then(v=>{try{if(v){const o=JSON.parse(v);S=Object.assign(S,o);S.up=Object.assign({pat:0,time:0,hint:0,tip:0},o.up)}}catch(e){}menu()});
</script></body></html>
